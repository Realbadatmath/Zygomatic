<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8dd8ff"/>
      <stop offset="100%" stop-color="#2a80c8"/>
    </linearGradient>
    <radialGradient id="bg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#16284a"/>
      <stop offset="100%" stop-color="#07111f"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background card -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Subtle border -->
  <rect width="32" height="32" rx="7" fill="none" stroke="#1e3a60" stroke-width="1"/>
  <!-- C letterform: arc from upper-right to lower-right going counterclockwise (through left) -->
  <path
    d="M 24.0,9.2 A 10.5,10.5 0 1,0 24.0,22.8"
    fill="none"
    stroke="url(#cg)"
    stroke-width="5"
    stroke-linecap="round"
    filter="url(#glow)"
  />
</svg>
