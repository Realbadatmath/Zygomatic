[Service]
# OLLAMA_NUM_PARALLEL was 3 until 2026-09-17. It allocates that many KV cache
# slots for whichever model is loaded, and the cost scales with the model:
# Medusa's Vicky brain (Dolphin-Mistral-24B Q8_0 — 40 layers x 8 kv heads x 128,
# 32k context) needs 5.0 GiB per slot. At 3 slots that was 23.3 GiB of weights
# plus 15 GiB of cache, and `ollama ps` reported 47 GB at 1%/99% CPU/GPU on a
# 48 GB card — a DENSE 24B partly on the CPU, which costs far more throughput
# than "1%" suggests. At 1 slot the same model is 28.3 GiB and fully resident,
# with ~17 GiB spare if the context is ever raised.
#
# Losing concurrency costs little here: OLLAMA_MAX_LOADED_MODELS=1 already
# serialises across models, so batch consumers (the qwen3.5:9b judges) were
# queueing behind whatever was loaded and now queue one request deeper.
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
