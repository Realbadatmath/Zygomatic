[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zygomatic-dashboard"
version = "1.0.0"
description = "Zygomatic dashboard — see README.md"
readme = "README.md"
# 3.12 is the floor zygomatic-workflows imposes (numpy>=2.5.2 requires Python>=3.12).
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
# Derived from the imports by `python scripts/list_imports.py` (run it again after adding an import).
# zygomatic-workflows is the base library; for local development install it from the sibling checkout:
#   pip install -e ../workflows
# requirements-lock.txt is regenerated with (--python because the interpreter first on PATH is 3.11,
# below the 3.12 floor above; --no-emit-package because zygomatic-workflows is the sibling package in this monorepo and
# not on any index — [tool.uv.sources] below makes uv resolve it from that path, so its transitive
# dependencies ARE in the lock, only the editable line for the package itself is left out):
#   uv pip compile pyproject.toml --all-extras --python /home/zygomatic/repos/.tools/venv/bin/python \
#     --no-emit-package zygomatic-workflows -o requirements-lock.txt
# and must stay clean under: pip-audit -r requirements-lock.txt --no-deps --disable-pip
# Lower bounds are the live production version or the lowest version that fixes every known advisory
# for that package, whichever is higher. Never `==`: this is an application package, the lock carries
# the pins.
dependencies = [
  "zygomatic-workflows>=0.1.0",
  "flask>=3.1.3",
  "flask-limiter>=4.1.1",
  "huggingface-hub>=0.36.2",
  "imageio-ffmpeg>=0.6.0",
  "matplotlib>=3.10.8",
  "mediapipe>=0.10.35",
  "mutagen>=1.47.0",
  "numpy>=2.5.2",
  "opencv-python>=4.13.0.92",
  "pillow>=12.3.0",
  "psutil>=7.2.2",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.3",
  "redis>=7.3.0",
  "requests>=2.34.2",
  "waitress>=3.0.2",
  "werkzeug>=3.1.6",
]

[project.optional-dependencies]
# Imported by src/ but deliberately NOT declared — install them by hand where they are needed:
#   crewai 0.70.0 (crewai_web_gui.py, crewai_pipeline.py, crewai_cli.py) and langchain-community
#     0.4.1 (crewai_cli.py) pull chromadb, whose live 1.5.5 carries 5 advisories with no fixed
#     release at all, so declaring them would make the lock permanently vulnerable.
#   vllm 0.17.1 / snac 1.2.1 — soft imports in bp_pipeline_api.py that only probe whether the local
#     Orpheus TTS stack is installed; they belong to the GPU venv, not to this package.
#   zyg_whisper — a local module of the production host, not a PyPI distribution.
# azure-functions is only needed to deploy src/zyg_dashboard/azure_function/.
azure = ["azure-functions>=1.24.0"]
gpu = [
  "diffusers>=0.38.0",
  "pynvml>=13.0.1",
  "torch>=2.13.0",
  "ultralytics>=8.4.21",
]
audio = ["soundfile>=0.13.1"]
llm = ["anthropic>=0.84.0"]
# google-api-python-client / google-auth: the YouTube upload path in bp_assets_media.py.
google = ["google-api-python-client>=2.197.0", "google-auth>=2.43.0"]
dev = ["pytest>=9.0.3", "pytest-timeout>=2.3", "ruff>=0.16", "bandit[toml]>=1.9", "reuse>=6", "import-linter>=2", "pip-audit>=2.10", "pre-commit>=4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"zyg_dashboard" = ["**/*.json", "**/*.html", "**/*.js", "**/*.css", "**/*.svg", "**/*.png", "**/*.ico", "**/*.cube", "**/*.md", "**/*.ini", "**/*.txt", "**/*.yaml", "**/*.yml", "**/*.conf"]

[tool.bandit]
exclude_dirs = ["tests", "tests_arch_ext", "tests_vst", "capability_tests", "deploy", "site", "docs"]
# B101 assert: used only in tests (excluded above). B603/B607: subprocess with argument lists, no shell.
# B311: random for sampling, never for secrets. Each remaining skip must carry a reason here.
skips = ["B101", "B603", "B607", "B311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No -q here: every documented invocation passes its own -q, and pytest 9 reads a second
# -q as -qq, which drops the "N passed in Xs" counts line the gates grep for.
addopts = "--no-header"
markers = [
  "slow: takes more than a few seconds",
  "api: exercises HTTP routes in-process",
  "gpu: needs a CUDA device",
  "service: needs a running local service (ComfyUI, Ollama, Blender, Postgres)",
  "timeout: per-test timeout (pytest-timeout)",
]

[tool.uv.sources]
zygomatic-workflows = { workspace = true }
