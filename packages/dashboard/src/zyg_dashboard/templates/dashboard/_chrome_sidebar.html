    <!-- ── Launcher Hub icon (upper-left) — the "ZH" neural badge, opens the Zygomatic Hub ──
         2026-08-25: was an inline tribal-hexagon SVG. Now the raster ZH badge the hub itself
         uses for its favicon and the XFCE dock launcher (source ~/Documents/favicon-hub/, see
         its README). The 128px cut is shown at 46px (~2.8x) so it stays crisp on HiDPI; 128 is
         cut from the "lg" master, the one meant for 64px and up. The ?v= is not decoration:
         /static images get no Cache-Control here (only .js/.css do), so browsers heuristically
         cache them for days and would keep painting an old file after a swap. -->
    <!-- 2026-08-25: the pair is centred in the sidebar as ONE unit. The row is fixed at the
         sidebar's width (192px, .dashboard-sidebar in dashboard_core.css) and centres its
         children, so neither icon carries a hard-coded left offset any more. -->
    <div class="dashboard-chrome-icons">
    <!-- The hub is a different port on the same machine, so the href cannot be relative.
         It is rewritten to the host the viewer actually used (see the script below), which
         is what makes the icon work from a phone on the LAN as well as from the box. -->
    <a href="http://127.0.0.1:7000" id="dashboard-hub-icon" class="dashboard-hub-icon"
       title="Open the Zygomatic Launcher Hub" aria-label="Open the Zygomatic Launcher Hub">
      <img src="/static/icons/hub_zh_128.png?v=1" alt="" width="46" height="46" draggable="false">
    </a>
    <!-- ── Inspection icon — sits beside the Hub icon, opens the Contact-Sheet Inspection SPA ──
         Served by kanban_server on :8899 (same host as the Workflows kanban iframe), NOT by
         this Flask app on :5000 — hence the absolute URL, exactly like the Hub icon above.
         2026-08-25: was the same hexagon ring with an eye inside. Now the illustrated eye that
         inspection.html and kanban.html use as their brand mark (~/Documents/favicon/
         inspect_eye.png, 204x130, transparent). It is a 1.57:1 image, NOT a square: it gets
         its own width and is centred in the 46px chrome row, because squeezing it into a
         46px square would letterbox it to ~29px of actual eye.
         2026-09-15: opens the studio through its TLS front door (nginx 443 -> :8899) on the
         Library view. The address is '#library', not '#inspections' — the operator does not
         want "inspections" in the URL; inspection.html still accepts the old address. -->
    <a href="https://studio.zygomaticszero.com/#library" id="dashboard-inspect-icon"
       class="dashboard-hub-icon dashboard-inspect-icon" target="_blank" rel="noopener"
       title="Open the Contact-Sheet Inspection page"
       aria-label="Open the Contact-Sheet Inspection page">
      <img src="/static/icons/inspect_eye.png?v=1" alt="" width="52" height="33" draggable="false">
    </a>
    </div>
    <script>
      (function () {
        var hub = document.getElementById('dashboard-hub-icon');
        if (hub) hub.href = window.location.protocol + '//' + window.location.hostname + ':7000';
      })();
    </script>
    <style>
      .dashboard-chrome-icons { position: fixed; top: 14px; left: 0; width: 192px; height: 46px;
        z-index: 1001; display: flex; align-items: center; justify-content: center; gap: 10px;
        pointer-events: none; }
      .dashboard-hub-icon { position: static; pointer-events: auto; flex: 0 0 auto;
        width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
        cursor: pointer; -webkit-tap-highlight-color: transparent;
        filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
        transition: transform .2s ease, filter .2s ease; }
      /* Raster icons cannot take the old currentColor hover tint; the cyan glow + a touch of
         brightness do that job now. */
      .dashboard-hub-icon:hover { transform: scale(1.08) rotate(-4deg);
        filter: drop-shadow(0 0 8px rgba(125,211,252,0.65)) brightness(1.12); }
      .dashboard-hub-icon:active { transform: scale(0.97); }
      .dashboard-hub-icon img { display: block; width: 46px; height: 46px; user-select: none; }
      .dashboard-inspect-icon { width: 52px; }
      .dashboard-inspect-icon img { width: 52px; height: auto; }
      .dashboard-inspect-icon:hover { transform: scale(1.08) rotate(4deg); }
    </style>
