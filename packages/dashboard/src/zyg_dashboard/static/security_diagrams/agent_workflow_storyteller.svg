    <text x="634"  y="140" text-anchor="middle">STAGE 3</text>
    <text x="874"  y="140" text-anchor="middle">STAGE 3.5</text>
    <text x="1114" y="140" text-anchor="middle">STAGE 4</text>
    <text x="1354" y="140" text-anchor="middle">STAGE 5</text>
    <text x="1594" y="140" text-anchor="middle">STAGE 6</text>
