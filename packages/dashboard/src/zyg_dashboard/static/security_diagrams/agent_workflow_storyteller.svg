  <text x="1806" y="488" font-size="9" fill="#6a3090" text-anchor="middle">YouTube</text>
  <text x="1806" y="504" font-size="9" fill="#6a3090" text-anchor="middle">TikTok</text>
  <text x="1806" y="520" font-size="9" fill="#6a3090" text-anchor="middle">Storyteller</text>
  <text x="1806" y="536" font-size="9" fill="#4a2060" text-anchor="middle">Channel</text>

