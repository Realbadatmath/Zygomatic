<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1920 1080">
  <defs>
    <style>text { font-family: 'Myriad Pro', 'Segoe UI', Arial, sans-serif; }</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0e0818"/><stop offset="100%" stop-color="#120c20"/></linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1920" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#150d20"/><stop offset="50%" stop-color="#1c1228"/><stop offset="100%" stop-color="#150d20"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0%" stop-color="#150d20"/><stop offset="100%" stop-color="#0c0814"/></linearGradient>
    <linearGradient id="boxHL" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0%" stop-color="#221530"/><stop offset="100%" stop-color="#160e1e"/></linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#c084fc" opacity="0.8"/></marker>
