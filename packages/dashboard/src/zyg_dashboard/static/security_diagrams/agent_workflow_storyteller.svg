  <text x="1594" y="466" font-size="9" fill="#4a2060" text-anchor="middle">TikTok</text>
  <text x="1594" y="482" font-size="9" fill="#4a2060" text-anchor="middle">SEO meta</text>
  <text x="1594" y="590" font-size="8" fill="#2a1040" text-anchor="middle" letter-spacing="1">STAGE 6 — DIST.</text>

