  <text x="60" y="960" font-size="10" fill="#c084fc" opacity="0.6" letter-spacing="2">NARRATOR PROFILE</text>
  <text x="60" y="984" font-size="11" fill="#4a2060">Per-character voice from narrator_voices.json. Engine: azure-tts for all profiles.</text>
  <text x="60" y="1002" font-size="11" fill="#4a2060">Character voices: per narrator_voices.json  |  Fallback: edge-tts</text>
  <text x="60" y="1044" font-size="9" fill="#2a1040" letter-spacing="1">Seed libraries: _HER_STORY_SEEDS / _HIS_STORY_SEEDS / _MADEUP_STORY_SEEDS (hardcoded, pending JSON migration)</text>
</svg>
