    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0800"/><stop offset="100%" stop-color="#140e00"/></linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1920" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#1a1200"/><stop offset="50%" stop-color="#221800"/><stop offset="100%" stop-color="#1a1200"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0%" stop-color="#1a1200"/><stop offset="100%" stop-color="#0e0b00"/></linearGradient>
    <linearGradient id="boxHL" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0%" stop-color="#2a1e00"/><stop offset="100%" stop-color="#181000"/></linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#fbbf24" opacity="0.8"/></marker>
