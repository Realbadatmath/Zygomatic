  <rect x="0" y="930" width="1920" height="150" fill="#040300" opacity="0.9"/>
  <line x1="0" y1="930" x2="1920" y2="930" stroke="#fbbf24" stroke-width="0.5" opacity="0.3"/>
  <text x="60" y="960" font-size="10" fill="#fbbf24" opacity="0.6" letter-spacing="2">NARRATOR PROFILE</text>
  <text x="60" y="984" font-size="11" fill="#5a4010">"Calm, data-driven analytical tone. State facts, cite numbers. Let the data tell the story."</text>
  <text x="60" y="1002" font-size="11" fill="#5a4010">TTS: en-GB-RyanNeural (Azure Neural)  |  Visual: FLUX.1-schnell stills with financial data overlays</text>
  <text x="60" y="1044" font-size="9" fill="#3a2808" letter-spacing="1">NOTE: Wyscamus/fraud topics route to Crime pipeline internally  |  Sources: MarketWatch · CoinGecko · HousingWire · Bisnow · FBI News</text>
