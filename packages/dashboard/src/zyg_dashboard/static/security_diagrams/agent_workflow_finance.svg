  <text x="1806" y="488" font-size="9" fill="#8a6a00" text-anchor="middle">YouTube</text>
  <text x="1806" y="504" font-size="9" fill="#8a6a00" text-anchor="middle">TikTok</text>
  <text x="1806" y="520" font-size="9" fill="#8a6a00" text-anchor="middle">Financials</text>
  <text x="1806" y="536" font-size="9" fill="#5a4010" text-anchor="middle">Channel</text>

