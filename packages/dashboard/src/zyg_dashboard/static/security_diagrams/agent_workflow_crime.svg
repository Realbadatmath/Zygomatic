  <rect x="1485" y="350" width="218" height="280" rx="10" fill="url(#box)" stroke="#f87171" stroke-width="1.5"/>
  <line x1="1485" y1="350" x2="1703" y2="350" stroke="#f87171" stroke-width="0.8" opacity="0.4"/>
  <text x="1594" y="400" font-size="13" fill="#f87171" text-anchor="middle">Distribution</text>
  <text x="1594" y="418" font-size="9"  fill="#7a2020" text-anchor="middle" letter-spacing="1">MULTI-PLATFORM UPLOAD</text>
  <line x1="1505" y1="430" x2="1683" y2="430" stroke="#f87171" stroke-width="0.4" opacity="0.2"/>
  <text x="1594" y="450" font-size="9" fill="#4a1818" text-anchor="middle">YouTube upload</text>
  <text x="1594" y="466" font-size="9" fill="#4a1818" text-anchor="middle">Thumbnail + SEO meta</text>
  <text x="1594" y="482" font-size="9" fill="#4a1818" text-anchor="middle">TikTok (clipped)</text>
  <text x="1594" y="498" font-size="9" fill="#4a1818" text-anchor="middle">Schedule air time</text>
  <text x="1594" y="590" font-size="8" fill="#2a0c0c" text-anchor="middle" letter-spacing="1">STAGE 6 — DIST.</text>

  <!-- Arrow 7→output -->
  <line x1="1703" y1="490" x2="1725" y2="490" stroke="#f87171" stroke-width="1.5" opacity="0.7" marker-end="url(#arr)"/>

  <!-- OUTPUT box -->
  <rect x="1725" y="420" width="162" height="140" rx="10" fill="#060304" stroke="#f87171" stroke-width="2" opacity="0.9"/>
  <text x="1806" y="468" font-size="11" fill="#f87171" text-anchor="middle">Published</text>
  <text x="1806" y="488" font-size="9" fill="#7a2020" text-anchor="middle">YouTube</text>
  <text x="1806" y="504" font-size="9" fill="#7a2020" text-anchor="middle">TikTok</text>
  <text x="1806" y="520" font-size="9" fill="#7a2020" text-anchor="middle">Crime Chronicles</text>
  <text x="1806" y="536" font-size="9" fill="#4a1010" text-anchor="middle">Channel</text>

  <!-- Bottom info strip -->
  <rect x="0" y="930" width="1920" height="150" fill="#060204" opacity="0.9"/>
  <line x1="0" y1="930" x2="1920" y2="930" stroke="#f87171" stroke-width="0.5" opacity="0.3"/>
  <text x="60" y="960" font-size="10" fill="#f87171" opacity="0.6" letter-spacing="2">NARRATOR PROFILE</text>
  <text x="60" y="984" font-size="11" fill="#5a1818">"You are a calm, authoritative documentary narrator for a true crime channel called Crime Chronicles."</text>
  <text x="60" y="1002" font-size="11" fill="#5a1818">"Write in present tense, documentary style. Be factual and measured. No speculation."</text>
  <text x="60" y="1020" font-size="11" fill="#5a1818">"Structure: INTRODUCTION → THE SUBJECT → THE EVENTS (vivid documentary detail)"</text>
  <text x="60" y="1044" font-size="9" fill="#3a0e0e" letter-spacing="1">TTS VOICE: en-GB-RyanNeural (Azure Neural) → edge-tts fallback  |  STILLS: FLUX.1-schnell + documentary-cinematic LoRA (checkpoint-6000)  |  GPU LOCK: scholarly_gpu.lock</text>
</svg>
