  <g stroke="#f87171" stroke-width="0.5" opacity="0.2">
    <line x1="154"  y1="146" x2="154"  y2="160"/>
    <line x1="394"  y1="146" x2="394"  y2="160"/>
    <line x1="634"  y1="146" x2="634"  y2="160"/>
    <line x1="874"  y1="146" x2="874"  y2="160"/>
    <line x1="1114" y1="146" x2="1114" y2="160"/>
    <line x1="1354" y1="146" x2="1354" y2="160"/>
    <line x1="1594" y1="146" x2="1594" y2="160"/>
    <line x1="1806" y1="146" x2="1806" y2="160"/>
