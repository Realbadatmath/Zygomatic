<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1920 1080">
  <defs>
    <style>text { font-family: 'Myriad Pro', 'Segoe UI', Arial, sans-serif; }</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0304"/><stop offset="100%" stop-color="#140608"/></linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1920" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#180608"/><stop offset="50%" stop-color="#200a0c"/><stop offset="100%" stop-color="#180608"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0%" stop-color="#1a0608"/><stop offset="100%" stop-color="#0e0304"/></linearGradient>
    <linearGradient id="boxHL" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0%" stop-color="#2a0a0c"/><stop offset="100%" stop-color="#180608"/></linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#f87171" opacity="0.8"/></marker>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1920" height="80" fill="url(#hdr)"/>
  <line x1="0" y1="80" x2="1920" y2="80" stroke="#f87171" stroke-width="1" opacity="0.5"/>

  <!-- Header -->
  <text x="60" y="30" font-size="10" fill="#f87171" opacity="0.5" letter-spacing="2">CHANNEL</text>
  <text x="60" y="56" font-size="28" font-weight="300" fill="#f87171" letter-spacing="4">CRIME CHRONICLES</text>
  <text x="1860" y="44" font-size="10" fill="#4a1010" text-anchor="end" letter-spacing="2">AGENT WORKFLOW PRESET · TRUE CRIME DOCUMENTARY</text>

  <!-- Stage labels (top) -->
