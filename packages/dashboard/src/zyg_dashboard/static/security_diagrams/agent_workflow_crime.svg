  <text x="154"  y="418" font-size="9"  fill="#7a2020" text-anchor="middle" letter-spacing="1">CRIME DATA AGENT</text>
  <line x1="65"  y1="430" x2="243" y2="430" stroke="#f87171" stroke-width="0.4" opacity="0.2"/>
  <text x="154"  y="450" font-size="9" fill="#4a1818" text-anchor="middle">BBC Crime RSS</text>
  <text x="154"  y="466" font-size="9" fill="#4a1818" text-anchor="middle">FBI News Feed</text>
  <text x="154"  y="482" font-size="9" fill="#4a1818" text-anchor="middle">crime_used_cases.json</text>
  <text x="154"  y="498" font-size="9" fill="#4a1818" text-anchor="middle">Dedup check</text>
  <text x="154"  y="514" font-size="9" fill="#4a1818" text-anchor="middle">Recency + impact score</text>
  <text x="154"  y="540" font-size="9" fill="#3a1010" text-anchor="middle">→ Selects 1 subject</text>
  <text x="154"  y="556" font-size="9" fill="#3a1010" text-anchor="middle">per pipeline run</text>
  <text x="154"  y="590" font-size="8" fill="#2a0c0c" text-anchor="middle" letter-spacing="1">FLOW0201</text>

  <!-- Arrow 1→2 -->
  <line x1="263" y1="490" x2="285" y2="490" stroke="#f87171" stroke-width="1.5" opacity="0.7" marker-end="url(#arr)"/>

  <!-- BOX 2: Research Agent (x=285) -->
  <rect x="285"  y="350" width="218" height="280" rx="10" fill="url(#box)" stroke="#f87171" stroke-width="1.5"/>
  <line x1="285" y1="350" x2="503" y2="350" stroke="#f87171" stroke-width="0.8" opacity="0.4"/>
  <text x="394"  y="400" font-size="13" fill="#f87171" text-anchor="middle">Research Agent</text>
  <text x="394"  y="418" font-size="9"  fill="#7a2020" text-anchor="middle" letter-spacing="1">DOCUMENTARY RESEARCH</text>
  <line x1="305" y1="430" x2="483" y2="430" stroke="#f87171" stroke-width="0.4" opacity="0.2"/>
  <text x="394"  y="450" font-size="9" fill="#4a1818" text-anchor="middle">Wikipedia deep-fetch</text>
  <text x="394"  y="466" font-size="9" fill="#4a1818" text-anchor="middle">Court records context</text>
  <text x="394"  y="482" font-size="9" fill="#4a1818" text-anchor="middle">Timeline construction</text>
  <text x="394"  y="498" font-size="9" fill="#4a1818" text-anchor="middle">Subject classification</text>
