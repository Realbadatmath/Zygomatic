  <text x="874"  y="462" font-size="9" fill="#5a2020" text-anchor="middle">en-GB-RyanNeural</text>
  <text x="874"  y="478" font-size="9" fill="#5a2020" text-anchor="middle">FLUX.1-schnell + LoRA</text>
