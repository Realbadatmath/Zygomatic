  <rect x="1245" y="350" width="218" height="280" rx="10" fill="url(#box)" stroke="#f87171" stroke-width="1.5"/>
  <line x1="1245" y1="350" x2="1463" y2="350" stroke="#f87171" stroke-width="0.8" opacity="0.4"/>
  <text x="1354" y="400" font-size="13" fill="#f87171" text-anchor="middle">QC + Approval</text>
  <text x="1354" y="418" font-size="9"  fill="#7a2020" text-anchor="middle" letter-spacing="1">INTEGRITY GATE</text>
  <line x1="1265" y1="430" x2="1443" y2="430" stroke="#f87171" stroke-width="0.4" opacity="0.2"/>
  <text x="1354" y="450" font-size="9" fill="#4a1818" text-anchor="middle">Content policy check</text>
  <text x="1354" y="466" font-size="9" fill="#4a1818" text-anchor="middle">Fact safety filter</text>
  <text x="1354" y="482" font-size="9" fill="#4a1818" text-anchor="middle">Human approval queue</text>
  <text x="1354" y="498" font-size="9" fill="#4a1818" text-anchor="middle">Approval gate bypass</text>
  <text x="1354" y="514" font-size="9" fill="#4a1818" text-anchor="middle">(auto if score high)</text>
  <text x="1354" y="590" font-size="8" fill="#2a0c0c" text-anchor="middle" letter-spacing="1">STAGE 5 — GATE</text>

  <!-- Arrow 6→7 -->
  <line x1="1463" y1="490" x2="1485" y2="490" stroke="#f87171" stroke-width="1.5" opacity="0.7" marker-end="url(#arr)"/>

