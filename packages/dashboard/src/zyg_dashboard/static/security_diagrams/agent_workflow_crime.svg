  <text x="634"  y="466" font-size="9" fill="#5a2020" text-anchor="middle">Present tense, measured</text>
  <text x="634"  y="482" font-size="9" fill="#5a2020" text-anchor="middle">1400–2000 words</text>
  <text x="634"  y="498" font-size="9" fill="#5a2020" text-anchor="middle">3-act structure</text>
  <text x="634"  y="514" font-size="9" fill="#5a2020" text-anchor="middle">Factual, no speculation</text>
