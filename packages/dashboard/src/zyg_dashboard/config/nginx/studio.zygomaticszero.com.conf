# Zygomatic studio — TLS front door for the :8899 GUI (inspection.html + voice bridge).
# Deploy to: /etc/nginx/sites-available/studio.zygomaticszero.com.conf
#            symlinked into /etc/nginx/sites-enabled/
# Requires:  /etc/nginx/conf.d/upgrade_map.conf  (defines $connection_upgrade)
#
# Does NOT touch the existing port-80 site (server_name ZygomaticsZero.local _ -> :5001):
# the redirect server below matches the exact host studio.zygomaticszero.com, which nginx
# prefers over the catch-all name of the other site.

server {
    listen 80;
    listen [::]:80;
    server_name studio.zygomaticszero.com;

    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24 (the installed build) has no `http2 on;` directive — that arrived in
    # 1.25.1. HTTP/2 is enabled with the listen flag instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studio.zygomaticszero.com;

    ssl_certificate     /home/zygomatic/.config/zygomatic/letsencrypt/live/studio.zygomaticszero.com/fullchain.pem;
    ssl_certificate_key /home/zygomatic/.config/zygomatic/letsencrypt/live/studio.zygomaticszero.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Voice utterances are uploaded as audio blobs; renders are downloaded as large files.
    client_max_body_size 0;

    location / {
        proxy_pass         http://127.0.0.1:8899;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket upgrade ($connection_upgrade comes from conf.d/upgrade_map.conf)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Essential: the voice bridge streams Server-Sent Events on
        # /inspect/api/voice/events. With buffering on, nginx holds the stream
        # and the browser never sees an event until the response ends.
        proxy_buffering off;
        proxy_cache     off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        chunked_transfer_encoding on;
    }
}
