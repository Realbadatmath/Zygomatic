# Throwaway wrapper so the two shipped fragments can be syntax-checked without root.
# Run it from the directory this file lives in; -p makes that directory nginx's prefix,
# which is what the two bare `include` names below resolve against, so no absolute path
# to any tree is baked in here:
#   nginx -t -p "$(pwd)" -c "$(pwd)/_selftest.conf"
# It includes the real files verbatim. Everything nginx wants to write goes to /tmp.
# The certificates named by the site file must exist for `nginx -t` to pass; see
# docs/voice_bridge_nginx.md for the self-signed stand-in used before certbot runs.

pid         /tmp/vb_nginx_selftest/nginx.pid;
error_log   /tmp/vb_nginx_selftest/error.log;

events { worker_connections 64; }

http {
    access_log  /tmp/vb_nginx_selftest/access.log;
    client_body_temp_path /tmp/vb_nginx_selftest/client_body;
    proxy_temp_path       /tmp/vb_nginx_selftest/proxy;
    fastcgi_temp_path     /tmp/vb_nginx_selftest/fastcgi;
    uwsgi_temp_path       /tmp/vb_nginx_selftest/uwsgi;
    scgi_temp_path        /tmp/vb_nginx_selftest/scgi;

    include "upgrade_map.conf";
    include "studio.zygomaticszero.com.conf";
}
